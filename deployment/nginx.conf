server {
    listen 8080;
    # h2c required: Cloud Run caps non-chunked HTTP/1 responses at 32 MiB,
    # which breaks the 282 MB data.unityweb. Service runs with --use-http2.
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.framework\.js\.unityweb$ {
        types {}
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.wasm\.unityweb$ {
        types {}
        default_type application/wasm;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.data\.unityweb$ {
        types {}
        default_type application/octet-stream;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.loader\.js$ {
        types {}
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /StreamingAssets/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location /TemplateData/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}